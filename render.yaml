services:
  - type: web
    name: gilto
    runtime: docker
    plan: starter         # about 512 MB RAM, which should be enough now that embeddings run on the Gemini API. If it runs out of memory, change this to standard.
    healthCheckPath: /_stcore/health
    disk:
      name: gilto-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: CHROMA_PATH
        value: /data/chroma_db
      - key: OCR_CACHE_PATH
        value: /data/ocr_cache
      - key: SQLITE_PATH
        value: /data/gilto.db
      - key: AUTH_DISABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false